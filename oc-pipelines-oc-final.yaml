apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: accounts-service-pipeline
  namespace: default
spec:
  params:
    - name: git-url
      type: string
      description: The URL of the Git repository
      default: https://github.com/AveryJan/accounts-service.git
    - name: git-branch
      type: string
      description: The Git branch to checkout
      default: main
    - name: image-registry
      type: string
      description: The image registry URL
      default: quay.io
    - name: image-namespace
      type: string
      description: The image namespace
      default: AveryJan
    - name: image-name
      type: string
      description: The image name
      default: accounts-service
    - name: image-tag
      type: string
      description: The image tag
      default: latest

  workspaces:
    - name: source
      description: Shared workspace for source code

  tasks:
    # Task 1: Cleanup
    - name: cleanup
      taskRef:
        name: cleanup-task
      workspaces:
        - name: source
          workspace: source

    # Task 2: Git Clone
    - name: git-clone
      taskRef:
        name: git-clone-task
      runAfter:
        - cleanup
      workspaces:
        - name: source
          workspace: source
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-branch
          value: $(params.git-branch)

    # Task 3: Flake8 Linting
    - name: flake8-lint
      taskRef:
        name: flake8-lint-task
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: source

    # Task 4: Nose Testing
    - name: nose-test
      taskRef:
        name: nose-test-task
      runAfter:
        - flake8-lint
      workspaces:
        - name: source
          workspace: source

    # Task 5: Buildah Build
    - name: buildah-build
      taskRef:
        name: buildah-build-task
      runAfter:
        - nose-test
      workspaces:
        - name: source
          workspace: source
      params:
        - name: image-registry
          value: $(params.image-registry)
        - name: image-namespace
          value: $(params.image-namespace)
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(params.image-tag)

    # Task 6: OpenShift Deploy
    - name: openshift-deploy
      taskRef:
        name: openshift-deploy-task
      runAfter:
        - buildah-build
      workspaces:
        - name: source
          workspace: source
      params:
        - name: image-registry
          value: $(params.image-registry)
        - name: image-namespace
          value: $(params.image-namespace)
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(params.image-tag)

---
# Task: Cleanup
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
  namespace: default
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        echo "=== Cleanup Task Started ==="
        echo "Cleaning workspace..."
        rm -rf .pytest_cache || true
        find . -type d -name "__pycache__" -exec rm -rf {} + || true
        find . -type f -name "*.pyc" -delete || true
        echo "Workspace cleaned successfully."
        echo "=== Cleanup Task Completed ==="

---
# Task: Git Clone
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone-task
  namespace: default
spec:
  params:
    - name: git-url
      type: string
    - name: git-branch
      type: string
  workspaces:
    - name: source
  steps:
    - name: git-clone
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        echo "=== Git Clone Task Started ==="
        echo "Cloning repository: $(params.git-url)"
        git clone -b $(params.git-branch) $(params.git-url) .
        echo "Repository cloned successfully."
        echo "=== Git Clone Task Completed ==="

---
# Task: Flake8 Linting
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8-lint-task
  namespace: default
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        echo "Installing dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: run-flake8
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        echo "=== Flake8 Linting Task Started ==="
        echo "Running flake8 linter..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "Flake8 linting completed successfully."
        echo "=== Flake8 Linting Task Completed ==="

---
# Task: Nose Testing
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test-task
  namespace: default
spec:
  workspaces:
    - name: source
  steps:
    - name: install-test-dependencies
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        echo "Installing test dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nose

    - name: run-nose-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        echo "=== Nose Testing Task Started ==="
        echo "Running unit tests with nose..."
        nosetests -v
        echo "Unit tests completed successfully."
        echo "=== Nose Testing Task Completed ==="

---
# Task: Buildah Build
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah-build-task
  namespace: default
spec:
  params:
    - name: image-registry
      type: string
    - name: image-namespace
      type: string
    - name: image-name
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-image
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        echo "=== Buildah Build Task Started ==="
        IMAGE=$(params.image-registry)/$(params.image-namespace)/$(params.image-name):$(params.image-tag)
        echo "Building image: $IMAGE"
        buildah bud -t $IMAGE .
        echo "Image built successfully: $IMAGE"
        echo "=== Buildah Build Task Completed ==="

---
# Task: OpenShift Deploy
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: openshift-deploy-task
  namespace: default
spec:
  params:
    - name: image-registry
      type: string
    - name: image-namespace
      type: string
    - name: image-name
      type: string
    - name: image-tag
      type: string
  workspaces:
    - name: source
  steps:
    - name: deploy-to-openshift
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        echo "=== OpenShift Deploy Task Started ==="
        IMAGE=$(params.image-registry)/$(params.image-namespace)/$(params.image-name):$(params.image-tag)
        echo "Deploying image: $IMAGE"
        
        # Create or update deployment
        oc set image deployment/accounts-service \
          accounts-service=$IMAGE \
          -n default || \
        oc create deployment accounts-service \
          --image=$IMAGE \
          -n default
        
        echo "Deployment completed successfully."
        echo "=== OpenShift Deploy Task Completed ==="
